<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Black square background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Dark blue circle -->
  <circle cx="16" cy="16" r="14" fill="#1e3a5f"/>
  
  <!-- 8 sections created by 4 diagonal lines in sky blue -->
  <!-- Top-left to bottom-right diagonal -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#4a9eff" stroke-width="1.5"/>
  
  <!-- Left to right horizontal -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#4a9eff" stroke-width="1.5"/>
  
  <!-- Top-right to bottom-left diagonal -->
  <line x1="4.86" y1="4.86" x2="27.14" y2="27.14" stroke="#4a9eff" stroke-width="1.5"/>
  
  <!-- Bottom-left to top-right diagonal -->
  <line x1="4.86" y1="27.14" x2="27.14" y2="4.86" stroke="#4a9eff" stroke-width="1.5"/>
  
  <!-- Center square in lighter sky blue -->
  <rect x="12" y="12" width="8" height="8" fill="#5eafff"/>
</svg>